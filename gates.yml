##
# Human approval registry for NEXT_STEPS.agent.md.
#
# Project-docroot hook data. Same lookup as env.yml: dry-run, custom suffix
# yml, -r. Rung 4 wins. The file is not sourced and is not loaded into globals.
#
#   hook_ms 'dry-run' -s 'doc' -a 'gates' -c 'yml' \
#     -v 'STACK_VERSION HOST_TYPE INSTANCE_TYPE' -r
#
# Variant files, if present, replace this one (later / more specific wins),
# same list as env.yml:
#   gates.$INSTANCE_TYPE.yml
#   gates.$STACK_VERSION.yml
#   gates.$HOST_TYPE.$INSTANCE_TYPE.yml
#   gates.$STACK_VERSION.$HOST_TYPE.yml
#   gates.$STACK_VERSION.$INSTANCE_TYPE.yml
#   gates.$STACK_VERSION.$HOST_TYPE.$INSTANCE_TYPE.yml
#
# A task may go ahead only when go is yes. Set go to yes only when approved
# is yes, lane is sequential or parallel, and (for sequential) every lower
# order in that lane already has go yes. discuss and held stay no.
#
# summary is one or two short sentences. It is enough to approve the row
# without opening the changelog.
#
# $ in comments here is the ASC placeholder ($subject / $action), not a shell variable.
#

source: NEXT_STEPS.agent.md

gates:
  - changelog: changelog/2026/09/11-lazy-opt-inc-and-entry-point-extraction.md
    lane: sequential
    order: 1
    task: "Optional: measure wrap vs action bootstrap cost."
    summary: "Time how costly the wrap process (`call_wrap.make.sh`) is versus the action process bootstrap before thinning what wrap sources. Approving only authorizes that measurement; it does not change `call_wrap` yet."
    approved: "yes"
    go: "yes"

  - changelog: changelog/2026/07/31-nameref-clarity-candidates.md
    lane: discuss
    order: 1
    task: "Inventory. Docs only."
    summary: "Keep the nameref clarity inventory as docs only (suffix renames already landed). Approving a later pilot would allow focused `declare -n` migrations; this row is not that go-ahead and forbids a repo-wide rewrite."
    approved: "yes"
    go: "yes"

  - changelog: changelog/2026/09/22-make-ds.md
    lane: discuss
    order: 1
    task: "Plan review for make ds. First code slice is print-only."
    summary: "Accept make ds as the short pivot for a core DSL entry point, and limit the first code slice to printing one literal call. Setting go authorizes that print slice only; combinators, calling-scope tokens, and execution stay unwritten."
    approved: "no"
    go: "no"

  - changelog: changelog/2026/09/22-agent-llm-entry-point.md
    lane: discuss
    order: 2
    task: "Plan review for make agent-llm (hook call in agent, hook implementation in cursor)."
    summary: "Accept make agent-llm as one abstract pivot: agent core extension makes the hook call; cursor contrib supplies the hook implementation when enabled. Setting go authorizes that layout only; no second pivot and no implementation until then."
    approved: "no"
    go: "no"

  - changelog: changelog/2026/09/22-make-generate.md
    lane: discuss
    order: 3
    task: "Plan review for make generate. First code slice is string print."
    summary: "Fill the existing make generate script so it renders builder templates, starting with one {{ name }} string on stdout. Setting go authorizes that print slice only; file mode, directory mode, and asc-if stay unwritten."
    approved: "no"
    go: "no"

  - changelog: changelog/2026/09/22-workflow.md
    lane: discuss
    order: 4
    task: "Plan review for workflow-next. Print runnable gates rows only."
    summary: "Add workflow-next to print gates rows that are sequential or parallel with go yes. The make ds changelog is the case study. Setting go authorizes that printer only; no model call and no host copy."
    approved: "no"
    go: "no"

  - changelog: changelog/2026/09/22-gitflow.md
    lane: discuss
    order: 5
    task: "Accept or reject the mother, buffer, and machine-branch contract."
    summary: "Treat the README workflow proposal as a candidate git contract: machine branch pulls a shared buffer before push, and only a change every instance shares moves into the mother. Setting go accepts that contract for a later session; it does not add a script or change git-acp."
    approved: "no"
    go: "no"
