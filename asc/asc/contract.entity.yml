contract:

  # As a primordial entity, we can still inherit from synonyms.
  include:
    - asc.contract.able

  # Any yml file definition inherits from the meta yml definition (asc defaults).
  # It gives the ability to occupy the ASC "naming space" with shortcuts.
  synonyms:
    op:
      - operation
    sk:
      - capacity
      - capability
      - ability
      - skill

  # This allows (cap)abilities whitelists and blacklists (on/off *.able.yml) in
  # our custom ASC DSL (rules).
  # TODO : draft yml spec for finer-grained restrictions, compatibility, next-steps, etc.
  operation:
    is: '*'
    access: '*'
    include: '*' # synonym : depends ? inherits ?
    field: '*'
    triple: '*'
    link: '*'
    synonym: '*'
    override: '*'
    hook: '*'
    wrap: '*'
    nest: '*'
    sidecar: '*'
    entity: '*'
    taxonomy: '*'
    cognition: '*'
    # Last but not least : (cap)ability to define contracts.
    # Any contract rule is scoped by subject, starting at current (relative) asc
    # "level" (situation in dsl : nesting scope, wrapping scope, asc
    # instance scope, host scope, remote scope, etc).
    contract: '*'

  # This allows to enforce which things are mandatory.
  required:
    field:
      is:
        validate: test.has(one.of[ $operation ])
    action:
      rule: at_least[ 1 ].of[ $subject/$operation.able.yml[ $action ]]

  # And / or optional things.
  optional:
    fields:
      - includes
      - depends
