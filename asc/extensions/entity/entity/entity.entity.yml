# Primordial ASC entity (*.entity inheritance chain root).
include: asc.yml

# This allows (cap)abilities whitelists and blacklists (on/off *.able.yml) in
# our custom ASC DSL (rules).
# TODO : draft yml spec for finer-grained restrictions, compatibility, next-steps, etc.
entity:
  is: '*'
  access: '*'
  include: '*' # synonym : depends ? inherits ?
  field: '*'
  triple: '*'
  link: '*'
  synonym: '*'
  override: '*'
  hook: '*'
  wrap: '*'
  nest: '*'
  sidecar: '*'
  entity: '*'
  taxonomy: '*'
  cognition: '*'
  # Last but not least : (cap)ability to define contracts (= supported yml keys)
  # Any contract rule is scoped by subject, starting at current (relative) asc
  # "level" (situation in dsl : nesting scope, wrapping scope, asc
  # instance scope, host scope, remote scope, etc).
  contract: '*'

# This allows to enforce which things are mandatory.
required:
  field:
    type:
      validate: test-entity-defines-type(p-1)

# And / or indicate optional things.
optional:
  prop:
    - entity
    - include
  field:
    name:
      default:
        val: ''
    bundle:
      default: '$entity.type'
      validate: test-entity-defines-bundle(p-1)
